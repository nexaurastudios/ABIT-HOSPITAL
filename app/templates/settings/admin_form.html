{% extends "base.html" %}
{% block title %}{{ 'Edit Administrator' if admin else 'Create Administrator' }} - Apex Health{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card border-0 shadow-sm rounded-3">
      <div class="card-header bg-white border-bottom py-3">
        <h5 class="fw-bold mb-0 text-dark">
          <i class="bi bi-shield-lock me-2 text-primary"></i>{{ 'Edit Administrator Account' if admin else 'Create Administrator Account' }}
        </h5>
      </div>
      <div class="card-body p-4">
        <form method="POST" action="{{ url_for('settings.edit_admin', id=admin.id) if admin else url_for('settings.create_admin') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="row mb-3">
            <div class="col-md-6 mb-3 mb-md-0">
              <label class="form-label small fw-semibold">Full Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" name="full_name" value="{{ admin.full_name if admin else '' }}" placeholder="Dr. Samantha Reed" required>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Email Address <span class="text-danger">*</span></label>
              <input type="email" class="form-control" name="email" value="{{ admin.email if admin else '' }}" placeholder="admin@apexhealth.org" {{ 'readonly' if admin else 'required' }}>
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-md-6 mb-3 mb-md-0">
              <label class="form-label small fw-semibold">Phone Number</label>
              <input type="text" class="form-control" name="phone" value="{{ admin.phone if admin else '' }}" placeholder="+1 555-0100">
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Role &amp; Permissions <span class="text-danger">*</span></label>
              <select class="form-select" name="role_id" required>
                {% for r in roles %}
                  <option value="{{ r.id }}" {{ 'selected' if admin and admin.has_role(r.name) else '' }}>{{ r.name }}</option>
                {% endfor %}
              </select>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label small fw-semibold">
              {{ 'Reset Password (leave empty to keep unchanged)' if admin else 'Account Password *' }}
            </label>
            <input type="password" class="form-control" name="{{ 'new_password' if admin else 'password' }}" placeholder="••••••••" {{ '' if admin else 'required' }}>
          </div>

          {% if admin %}
            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="is_active" name="is_active" {{ 'checked' if admin.is_active else '' }}>
              <label class="form-check-label small fw-semibold" for="is_active">Account is Active</label>
            </div>
          {% endif %}

          <div class="d-flex justify-content-end gap-2 pt-3 border-top">
            <a href="{{ url_for('settings.list_admins') }}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary px-4">
              <i class="bi bi-save me-1"></i>{{ 'Update Account' if admin else 'Create Account' }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
