{% extends "base.html" %}
{% block title %}404 Page Not Found - Hospital Optimization{% endblock %}
{% block content %}
<div class="container text-center py-5">
    <div class="card border-0 shadow-sm p-5 mx-auto" style="max-width: 550px;">
        <div class="text-warning mb-3">
            <i class="bi bi-exclamation-triangle" style="font-size: 4rem;"></i>
        </div>
        <h2 class="fw-bold text-dark">Record or Page Not Found (404)</h2>
        <p class="text-muted mt-2">
            The requested hospital record, report, or system route does not exist or may have been deleted.
        </p>
        <div class="mt-4">
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4">
                <i class="bi bi-house me-2"></i>Return to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
